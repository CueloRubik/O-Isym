name: Android APK
on:
  push:
    branches: [oisym-android]
  pull_request:
    branches: [oisym-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install dependencies
        run: |
          npm ci
          if [ -f mobile/package-lock.json ]; then
            npm --prefix mobile ci
          else
            npm --prefix mobile install
          fi
      - name: JavaScript and regression tests
        run: npm test
      - name: Install browser test tools
        run: |
          npm install --prefix .mobile-browser-check --no-save playwright@1.56.1
          .mobile-browser-check/node_modules/.bin/playwright install --with-deps chromium
      - name: Phone layout and touch gesture checks
        run: NODE_PATH="$PWD/.mobile-browser-check/node_modules" node scripts/check-mobile-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-screenshots
          path: mobile-ui-report/
      - name: Build debug APK
        run: npm run android:debug
      - name: Inspect APK
        run: |
          test -f dist-android/O-Isym-1.1.0-Android-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist-android/O-Isym-1.1.0-Android-debug.apk
          python3 scripts/check-android-icon.py dist-android/O-Isym-1.1.0-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: O-Isym-Android-debug
          path: |
            dist-android/*.apk
            mobile/package-lock.json
          if-no-files-found: error
      - name: Save verified Android dependency lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/oisym-android'
        run: |
          if ! git ls-files --error-unmatch mobile/package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobile/package-lock.json
            git commit -m "Lock verified Android dependencies [skip ci]"
            git push origin HEAD:oisym-android
          fi
