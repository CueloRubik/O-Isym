name: O-Isym tests

on:
  push:
    branches:
      - development
      - main
      - oisym-mac-intel
      - oisym-mac-universal
      - oisym-windows
  pull_request:
    branches:
      - development
      - main
      - oisym-mac-intel
      - oisym-mac-universal
      - oisym-windows

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Run automated tests
        shell: bash
        run: |
          node --check src/app.js
          node --check src/planning.js
          npm test
          node --check src/focus-audio.js
          node --check src/domain.js
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/ipc-handlers.js
          node --check electron/focus-notifications.js
          node --check electron/task-notifications.js
          node --check electron/storage.js


  macos-smoke:
    name: macOS smoke (Node 24)
    runs-on: macos-15
    if: github.ref == 'refs/heads/development' || github.ref == 'refs/heads/oisym-mac-intel' || github.ref == 'refs/heads/oisym-mac-universal'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install regression dependencies
        run: npm ci --ignore-scripts
      - name: Check Electron and planning JavaScript
        run: |
          node --check src/app.js
          node --check src/planning.js
          node --check electron/main.js
          node --check electron/storage.js
      - name: Run all regression tests on macOS
        run: npm test
