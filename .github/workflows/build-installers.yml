name: O-Isym 1.1.0 installers

# Build from the same source commit. Nothing is published automatically:
# inspect and test the artifacts before creating the public Release.
on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/build-installers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-intel:
    name: macOS Intel DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Create macOS application icon
        shell: bash
        run: |
          set -euo pipefail
          SRC=assets/icons/app.png
          test -f "$SRC"
          mkdir -p /tmp/O-Isym.iconset
          for size in 16 32 128 256 512; do
            sips -s format png -z "$size" "$size" "$SRC" --out "/tmp/O-Isym.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -s format png -z "$double" "$double" "$SRC" --out "/tmp/O-Isym.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns /tmp/O-Isym.iconset -o app.icns
      - run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: O-Isym-1.1.0-mac-intel
          path: dist/*.dmg
          if-no-files-found: error

  mac-universal:
    name: macOS Universal DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Create macOS application icon
        shell: bash
        run: |
          set -euo pipefail
          SRC=assets/icons/app.png
          test -f "$SRC"
          mkdir -p /tmp/O-Isym.iconset
          for size in 16 32 128 256 512; do
            sips -s format png -z "$size" "$size" "$SRC" --out "/tmp/O-Isym.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -s format png -z "$double" "$double" "$SRC" --out "/tmp/O-Isym.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns /tmp/O-Isym.iconset -o app.icns
      - run: npm run build:mac:universal
      - uses: actions/upload-artifact@v4
        with:
          name: O-Isym-1.1.0-mac-universal
          path: dist/*.dmg
          if-no-files-found: error

  windows-x64:
    name: Windows x64 EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Create Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          @'
          from PIL import Image
          from pathlib import Path
          src = Path("assets/icons/app.png")
          if not src.exists():
              raise FileNotFoundError(src)
          im = Image.open(src).convert("RGBA")
          im.save("app.ico", format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -
      - name: Build Windows NSIS
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: O-Isym-1.1.0-windows-x64
          path: dist/*.exe
          if-no-files-found: error
